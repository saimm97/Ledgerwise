{% extends "base.html" %}
{% block title %}Timesheet{% endblock %}

{% block content %}

<div class="page-header">
  <div class="page-header-row">
    <div>
      <h1 class="page-title">Timesheet</h1>
      <p class="page-subtitle">Log your hours against a project for a specific date.</p>
    </div>
    <div class="d-flex items-center gap-2">
      <span class="badge badge-primary mono" id="live-date">—</span>
      <a href="{% url 'my_timesheets' %}" class="btn btn-ghost">
      Back to Timesheets
    </a>
    </div>
  </div>
</div>


<div class="card form-card" style="max-width: 620px;">

  

  <div class="card-body">
    <form method="post" id="timesheet-form">
      {% csrf_token %}

     
      <div class="form-group">
        <label class="form-label" for="id_project">
          Project <span class="required">*</span>
        </label>
        {{ form.project }}
      </div>


      <div class="grid grid-2" style="gap: 16px;">

        <div class="form-group">
          <label class="form-label" for="id_date">
            Date <span class="required">*</span>
          </label>
          {{ form.date }}
        </div>

        <div class="form-group">
          <label class="form-label" for="id_hours_worked">
            Hours Worked <span class="required">*</span>
          </label>
          <div class="stepper">
            <button type="button" class="stepper-btn" onclick="changeHours(-0.5)" aria-label="Decrease">−</button>
            {{ form.hours_worked }}
            <button type="button" class="stepper-btn" onclick="changeHours(0.5)" aria-label="Increase">+</button>
          </div>
          <div class="hours-hint">
            <span class="hours-hint-dot"></span>
            <span id="hours-label">0 hrs · 0 min</span>
          </div>
        </div>

      </div>
    </form>
  </div>

  <div class="card-footer">
    <div class="d-flex items-center gap-3" style="justify-content: flex-end;">
      <button type="button" class="btn btn-ghost btn-sm" onclick="resetForm()">
  Reset
</button>
      <button type="submit" form="timesheet-form" class="btn btn-primary">
        Save entry
      </button>
    </div>
  </div>

</div>

<script>

  (function() {
    const el = document.getElementById('live-date');
    if (el) el.textContent = new Date().toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
  })();

 
  document.querySelectorAll(
    '#timesheet-form select, #timesheet-form input[type="date"], #timesheet-form input[type="text"]'
  ).forEach(el => el.classList.add('form-control'));


  function changeHours(step) {
    const input = document.getElementById('id_hours_worked');
    const val = Math.max(0, Math.round(((parseFloat(input.value) || 0) + step) * 2) / 2);
    input.value = val;
    updateLabel(val);
  }

  function updateLabel(val) {
    const label = document.getElementById('hours-label');
    if (!label) return;
    const h = Math.floor(val), m = (val % 1) * 60;
    label.textContent = `${h} hr${h !== 1 ? 's' : ''} · ${m} min`;
  }

  const hoursInput = document.getElementById('id_hours_worked');
  if (hoursInput) {
    hoursInput.addEventListener('input', () => updateLabel(parseFloat(hoursInput.value) || 0));
    updateLabel(parseFloat(hoursInput.value) || 0);
  }

  
  function dismissAlert(btn) {
    const el = btn.closest('.alert');
    el.classList.add('fade-out');
    setTimeout(() => el.remove(), 320);
  }

 function resetForm() {
  const form = document.getElementById('timesheet-form');

 
  const projectInput = document.getElementById('id_project');
  const dateInput = document.getElementById('id_date');
  const hoursInput = document.getElementById('id_hours_worked');

  if (projectInput) projectInput.selectedIndex = 0; 
  if (dateInput) dateInput.value = '';            
  if (hoursInput) hoursInput.value = 0;           

  
  updateLabel(0);

 
}
  updateLabel(val);
  document.querySelectorAll('.alert').forEach((el, i) => {
    setTimeout(() => {
      el.classList.add('fade-out');
      setTimeout(() => el.remove(), 320);
    }, 5000 + i * 400);
  });
</script>

{% endblock %}
