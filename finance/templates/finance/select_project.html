{% extends "base.html" %}

{% block content %}
<div class="page-header"><div class="page-header-row"><div><h1 class="page-title">Select a Project to view Invoices</h1></div></div></div>

<form method="get">
  <label for="project">Project:</label>
  <select id="project" name="project" onchange="location = this.value;">
    <option value="">-- Select Project --</option>
    {% for project in projects %}
      <option value="{% url 'company_invoices' company.id %}?project={{ project.id }}">
        {{ project.name }}
      </option>
    {% endfor %}
  </select>
</form>
{% endblock %}
