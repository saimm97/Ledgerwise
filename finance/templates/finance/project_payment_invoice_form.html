{% extends "base.html" %}
{% block content %}
<div class="page-header"><div class="page-header-row"><div><h1 class="page-title">Create Project Payment Invoice</h1></div></div></div>
<form method="post">
  {% csrf_token %}
  {{ form.as_p }}
  <button type="submit" class="btn btn-primary">Create & Send Invoice</button>
  <a href="{% url 'project-payment-invoice-list' %}" class="btn btn-secondary">Cancel</a>
</form>
{% endblock %}
