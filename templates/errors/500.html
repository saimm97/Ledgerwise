{% extends "base.html" %}
{% block title %}Something went wrong{% endblock %}

{% block content %}
<div class="empty-state" style="padding:72px 20px;">
  <div class="error-code">500</div>
  <h1 style="font-size:26px;margin:14px 0 8px;">Something went wrong</h1>
  <p class="text-muted" style="max-width:420px;margin:0 auto 24px;">An unexpected error occurred on our side. Please try again in a moment.</p>
  <a href="{% url 'home' %}" class="btn btn-primary">Go back home</a>
</div>
{% endblock %}
