{% extends "base.html" %}
{% block title %}Bad request{% endblock %}

{% block content %}
<div class="empty-state" style="padding:72px 20px;">
  <div class="error-code">400</div>
  <h1 style="font-size:26px;margin:14px 0 8px;">Bad request</h1>
  <p class="text-muted" style="max-width:420px;margin:0 auto 24px;">The request could not be understood. Please go back and try again.</p>
  <a href="{% url 'home' %}" class="btn btn-primary">Go back home</a>
</div>
{% endblock %}
