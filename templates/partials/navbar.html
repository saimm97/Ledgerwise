<header class="topbar" role="banner">
  <button type="button" class="icon-btn topbar-toggle" onclick="toggleSidebar()" aria-label="Open navigation">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
  </button>

  <div class="topbar-breadcrumb">
    {% if request.user.is_authenticated %}{{ request.user.company.name|default:"Company" }}{% else %}Welcome{% endif %}
  </div>

  <div class="topbar-actions">
    {% include "partials/theme_toggle.html" %}
    {% if request.user.is_authenticated %}
    <div class="topbar-divider"></div>
    <form method="POST" action="{% url 'logout' %}" style="display:inline;">
      {% csrf_token %}
      <button type="submit" class="btn btn-secondary btn-sm">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg>
        Sign out
      </button>
    </form>
    {% endif %}
  </div>
</header>
