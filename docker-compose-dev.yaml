
services:

  db:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"

  redis:
    image: redis:7
    restart: always
    ports:
      - "127.0.0.1:6379:6379"

  server:
    image: rafaydevsinc/ledgerwise-server:${IMAGE_TAG:-latest}
    pull_policy: always
    restart: always
    env_file:
      - .env
    depends_on:
      - db
      - redis
    ports:
      - "8000:8000"
    environment:
      - RUN_MIGRATIONS=true
      - DJANGO_SETTINGS_MODULE=Ledgerwise.settings.docker
      - REDIS_URL=redis://redis:6379/0
    entrypoint: /usr/local/bin/entrypoint.sh
    command: ["gunicorn", "Ledgerwise.wsgi:application", "--bind", "0.0.0.0:8000", "--workers", "3", "--access-logfile", "-"]

  celery:
    image: rafaydevsinc/ledgerwise-server:${IMAGE_TAG:-latest}
    pull_policy: always
    restart: always
    env_file:
      - .env
    depends_on:
      - db
      - redis
    environment:
      - DJANGO_SETTINGS_MODULE=Ledgerwise.settings.docker
      - REDIS_URL=redis://redis:6379/0  
    entrypoint: /usr/local/bin/entrypoint.sh
    command: ["celery", "-A", "Ledgerwise", "worker", "--loglevel=info"]

volumes:
  pgdata: